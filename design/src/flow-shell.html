<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audan.kz — юзерфлоу · Вариант 12</title>
<style>
@@BASESTYLES@@

/* ======================= SHELL · Figma-grade ======================= */
:root{ --acc:#2450D8; --acc-d:#1B3EA8; --acc-l:#6E8FF0; --acc-bg:#E7EDFD; --acc-h:#2E5CE8; --acc-sel:#1A2440; --acc-rgb:36,80,216; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#1C1C1F; color:#E6E6E9;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
*{ box-sizing:border-box; }
#pool{ display:none; }
[data-go]{ cursor:pointer; }

.topbar{ position:fixed; top:0; left:0; right:0; height:44px; z-index:100; display:flex; align-items:center; gap:10px;
  padding:0 10px 0 14px; background:#232326; border-bottom:1px solid #303034; }
.topbar .logo{ font-size:13.5px; font-weight:800; letter-spacing:-.01em; }
.topbar .logo i{ font-style:normal; color:var(--acc-l); }
.topbar .fname{ font-size:12.5px; color:#9A9AA0; font-weight:550; }
.topbar .fname b{ color:#CFCFD4; font-weight:650; }
.topbar .spacer{ flex:1; }
.zbox{ display:flex; align-items:center; background:#2C2C30; border:1px solid #3A3A40; border-radius:8px; overflow:hidden; }
.zbox button{ width:30px; height:30px; border:0; background:transparent; color:#CFCFD4; font-size:15px; cursor:pointer; font-family:inherit; }
.zbox button:hover{ background:#3A3A40; }
.zbox .pct{ min-width:52px; text-align:center; font-size:12px; font-weight:650; color:#CFCFD4; cursor:pointer; }
.present-btn{ height:32px; border:0; background:var(--acc); color:#fff; border-radius:8px; padding:0 14px;
  font-family:inherit; font-size:12.5px; font-weight:750; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.present-btn:hover{ background:var(--acc-h); }

.sidebar{ position:fixed; top:44px; left:0; bottom:0; width:236px; z-index:90; background:#232326;
  border-right:1px solid #303034; display:flex; flex-direction:column; }
.sidebar .sh{ padding:14px 16px 8px; font-size:10.5px; font-weight:800; letter-spacing:.1em; color:#7A7A82; text-transform:uppercase; }
.sidebar .list{ flex:1; overflow-y:auto; padding:0 8px 14px; }
.sitem{ display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; cursor:pointer; }
.sitem:hover{ background:#2C2C30; }
.sitem.on{ background:var(--acc-sel); }
.sitem .no{ width:20px; height:20px; border-radius:6px; background:#2C2C30; color:#9A9AA0; font-size:10.5px; font-weight:750;
  display:flex; align-items:center; justify-content:center; flex:none; }
.sitem.on .no{ background:var(--acc); color:#fff; }
.sitem .nm{ flex:1; min-width:0; font-size:12.5px; font-weight:600; color:#CFCFD4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sitem.on .nm{ color:#fff; }
.sitem .rt{ font-size:10.5px; color:#6E6E76; font-weight:550; }
.sidebar .foot{ padding:12px 16px; border-top:1px solid #303034; font-size:11px; line-height:1.6; color:#6E6E76; }
.sidebar .foot b{ color:#9A9AA0; }

.inspector{ position:fixed; top:44px; right:0; bottom:0; width:296px; z-index:90; background:#232326;
  border-left:1px solid #303034; overflow-y:auto; padding:18px 18px 24px; }
.inspector h3{ margin:0 0 3px; font-size:15.5px; font-weight:800; letter-spacing:-.01em; }
.inspector .route{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--acc-l); margin-bottom:14px; }
.inspector p{ font-size:12.5px; line-height:1.55; color:#ADADB4; margin:0 0 14px; }
.inspector h4{ margin:0 0 8px; font-size:10.5px; font-weight:800; letter-spacing:.1em; color:#7A7A82; text-transform:uppercase; }
.inspector ul{ margin:0 0 16px; padding:0; list-style:none; }
.inspector li{ font-size:12px; line-height:1.5; color:#9A9AA0; padding-left:14px; position:relative; margin-bottom:6px; }
.inspector li::before{ content:""; position:absolute; left:1px; top:6px; width:5px; height:5px; border-radius:2px; background:var(--acc); opacity:.85; }
.inspector .edge{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:#9A9AA0; margin-bottom:6px; }
.inspector .edge .arr{ color:var(--acc-l); font-weight:800; }
.inspector .edge b{ color:#CFCFD4; font-weight:650; }
.inspector .srcf{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; color:#6E6E76; border-top:1px solid #303034; padding-top:12px; margin-top:4px; }
.inspector .go{ width:100%; height:38px; border:0; border-radius:9px; background:var(--acc); color:#fff; font-family:inherit;
  font-size:12.5px; font-weight:750; cursor:pointer; margin:2px 0 18px; }
.inspector .go:hover{ background:var(--acc-h); }
.inspector .empty-legend{ font-size:12px; color:#9A9AA0; line-height:1.6; }
.inspector .empty-legend .sw{ display:inline-block; width:22px; height:0; border-top:2.5px solid var(--acc); vertical-align:middle; margin-right:8px; border-radius:2px; }
.inspector .empty-legend .sw.g{ border-color:#5F5F67; }

#viewport{ position:fixed; top:44px; left:236px; right:296px; bottom:0; overflow:hidden;
  background:#1C1C1F; background-image:radial-gradient(circle, #29292D 1px, transparent 1px); background-size:26px 26px; }
#viewport.grabbing{ cursor:grabbing; }
#world{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
#world.anim{ transition:transform .32s cubic-bezier(.2,.7,.2,1); }
#edges{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
#edges path{ fill:none; stroke:#5F5F67; stroke-width:2.5; }
#edges path.hot{ stroke:var(--acc); }
#edges path.dim{ opacity:.15; }
.elabel{ position:absolute; transform:translate(-50%,-50%); background:rgba(35,35,38,.92); border:1px solid #3A3A40;
  color:#B9B9C0; font-size:11px; font-weight:650; border-radius:999px; padding:4px 11px; white-space:nowrap; pointer-events:none; }
.elabel.hot{ border-color:rgba(var(--acc-rgb),.55); color:var(--acc-l); }
.elabel.dim{ opacity:.14; }

.node{ position:absolute; width:392px; }
.node .flabel{ display:flex; align-items:center; gap:7px; margin:0 2px 7px; cursor:pointer; user-select:none; }
.node .flabel .fn{ font-size:12px; font-weight:650; color:#9A9AA0; white-space:nowrap; }
.node .flabel .play{ width:20px; height:20px; border-radius:6px; border:0; background:transparent; color:#6E6E76;
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; padding:0; }
.node .flabel .play:hover{ color:var(--acc-l); background:#2C2C30; }
.node.sel .flabel .fn{ color:var(--acc-l); }
.node .shell-frame{ border-radius:48px; }
.node.sel .shell-frame{ outline:2.5px solid var(--acc); outline-offset:3px; }
.node .phone{ pointer-events:auto; }

#present{ position:fixed; inset:0; z-index:120; background:#111114; display:none; }
#present.on{ display:flex; flex-direction:column; }
.pbar{ height:48px; flex:none; display:flex; align-items:center; gap:10px; padding:0 12px; background:#1A1A1E; border-bottom:1px solid #2A2A2F; }
.pbtn{ height:32px; border:1px solid #3A3A40; background:#232326; color:#E6E6E9; border-radius:8px; padding:0 12px;
  font-family:inherit; font-size:12px; font-weight:650; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.pbtn:hover{ border-color:#55555C; }
.pbar .pt{ font-size:13px; font-weight:750; }
.pbar .ps{ font-size:11.5px; color:#8A8A92; font-weight:550; }
.pmain{ flex:1; display:flex; min-height:0; }
.pstage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-width:0; overflow:hidden; }
.pnav{ position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%;
  border:1px solid #3A3A40; background:#1E1F24; color:#E6E6E9; font-size:17px; cursor:pointer; z-index:5; }
.pnav:hover{ border-color:var(--acc); color:var(--acc-l); }
.pnav.prev{ left:16px; } .pnav.next{ right:16px; }
#fitwrap{ transform-origin:center center; width:412px; height:840px; flex:none; display:flex; align-items:center; justify-content:center; }
#fitwrap .phone{ width:392px; flex:none; }
#fitwrap .screen{ height:800px; }
.pdesc{ width:300px; flex:none; border-left:1px solid #2A2A2F; padding:22px 20px; overflow-y:auto; background:#17171B; }
.pdesc h3{ margin:0 0 3px; font-size:16px; font-weight:800; }
.pdesc .route{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--acc-l); margin-bottom:13px; }
.pdesc p{ font-size:12.5px; line-height:1.55; color:#ADADB4; margin:0 0 13px; }
.pdesc h4{ margin:0 0 8px; font-size:10.5px; font-weight:800; letter-spacing:.1em; color:#7A7A82; text-transform:uppercase; }
.pdesc ul{ margin:0 0 14px; padding:0; list-style:none; }
.pdesc li{ font-size:12px; line-height:1.5; color:#9A9AA0; padding-left:14px; position:relative; margin-bottom:6px; }
.pdesc li::before{ content:""; position:absolute; left:1px; top:6px; width:5px; height:5px; border-radius:2px; background:var(--acc); }
.pdesc .srcf{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; color:#6E6E76; border-top:1px solid #2A2A2F; padding-top:11px; }


.mexit{ position:absolute; z-index:9; left:16px; top:242px; display:flex; align-items:center; gap:7px; height:42px; padding:0 16px 0 13px;
  border-radius:999px; background:#fff; box-shadow:0 2px 10px rgba(20,20,25,.2); font-size:13px; font-weight:750; color:#1A1916; cursor:pointer; }
.mexit .ic{ width:17px; height:17px; }

#mdesc{ position:fixed; left:0; right:0; bottom:0; z-index:210; background:#17171B; border-top:1px solid #2A2A2F;
  border-radius:18px 18px 0 0; padding:20px 22px 26px; transform:translateY(105%); transition:transform .22s; max-height:62vh; overflow-y:auto; }
#mdesc.on{ transform:none; }
#mdesc h3{ margin:0 0 4px; font-size:17px; font-weight:800; }
#mdesc .route{ font-size:11px; color:var(--acc-l); font-family:ui-monospace,Menlo,monospace; margin-bottom:12px; }
#mdesc p{ font-size:13px; line-height:1.5; color:#ADADB4; margin:0 0 10px; }
#mdesc ul{ margin:0; padding:0; list-style:none; }
#mdesc li{ font-size:12px; line-height:1.5; color:#9A9AA0; padding-left:14px; position:relative; margin-bottom:5px; }
#mdesc li::before{ content:""; position:absolute; left:1px; top:6px; width:5px; height:5px; border-radius:2px; background:var(--acc); }
.mob-only{ display:none; }
@media (max-width:900px){
  .sidebar,.inspector,#viewport,.topbar{ display:none; }
  .mob-only{ display:inline-flex; }
  #present.on .pdesc{ display:none; }
  .pnav{ display:none; }
  #present .pstage{ align-items:stretch; }
  #fitwrap{ width:100%; height:auto; transform:none !important; }
  #fitwrap .phone{ width:100%; border-radius:0; padding:0; background:transparent; box-shadow:none; }
  #fitwrap .screen{ height:calc(100dvh - 48px); border-radius:0; }
}

.swatches{ display:flex; align-items:center; gap:5px; padding:0 4px; }
.swdiv{ width:1px; height:16px; background:#3A3A40; margin:0 3px; }
.sw{ width:18px; height:18px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; outline:none; }
.sw.on{ border-color:#fff; box-shadow:0 0 0 1.5px #55555C; }
.swname{ font-size:11.5px; color:#9A9AA0; font-weight:650; min-width:62px; white-space:nowrap; }

</style>
</head>
<body>

@@DEFS@@

<div id="pool">
@@POOL@@
</div>

<script>@@IMGS@@</script>

<div class="topbar">
  <span class="logo">Audan<i>.</i>kz</span>
  <span class="fname">Дизайн / <b>Юзерфлоу · Вариант 12 «Платформа»</b></span>
  <span class="spacer"></span>
  <span class="swname" id="swname">Кобальт</span><div class="swatches" id="swatches"></div>
  <div class="zbox">
    <button id="z-out" title="Уменьшить (−)">−</button>
    <span class="pct" id="z-pct" title="Вписать в экран (Shift+1)">45%</span>
    <button id="z-in" title="Увеличить (+)">+</button>
  </div>
  <button class="present-btn" id="btn-present">▶ Презентация</button>
</div>

<div class="sidebar">
  <div class="sh">Экраны · 38</div>
  <div class="list" id="slist"></div>
  <div class="foot">Колесо/трекпад — панорама · <b>⌘/Ctrl + колесо</b> — масштаб · клик — выбрать экран · <b>двойной клик</b> — презентация</div>
</div>

<div class="inspector" id="inspector"></div>

<div id="viewport"><div id="world">
  <svg id="edges"></svg>
</div></div>

<div id="present">
  <div class="pbar">
    <button class="pbtn" id="btn-exit">‹ Юзерфлоу</button>
    <span class="pt" id="p-title"></span>
    <span class="ps" id="p-route"></span>
    <span class="spacer" style="flex:1"></span>
    <button class="pbtn mob-only" id="btn-mdesc">ⓘ</button>
    <button class="pbtn" id="btn-home">⟲ С главной</button>
  </div>
  <div class="pmain">
    <div class="pstage">
      <button class="pnav prev" id="p-prev">‹</button>
      <div id="fitwrap"><div class="phone"><div class="screen" id="live"></div></div></div>
      <button class="pnav next" id="p-next">›</button>
    </div>
    <div class="pdesc" id="pdesc"></div>
  </div>
</div>

<div id="mdesc"></div>

<script>
(function(){
'use strict';

var SCREENS = [
  { id:'home', n:'Главная', sub:'/', p:'Сверху вниз: поиск, компактная карусель свежих объявлений, сервисы, карта-карточка, строка активного заказа еды, бесконечная лента «Свежее на базаре».', f:[

    'Лента вниз с подгрузкой; рекламные карточки продаются местами в ленте',
    'Карта — карточкой: топоним любой длины'], src:'home.summary · market.list (пагинация)' },
  { id:'search', n:'Поиск', sub:'/search', p:'Один вход для всего супер-аппа: объявления, места, мастера, вакансии и еда в одной выдаче по разделам. В прототипе поиск живой — набирайте запрос.', f:[
    'Частые запросы города — чипами',
    'Выдача сгруппирована по разделам',
    'Тап по результату ведёт в его раздел'], src:'search.global · market.list · bizmap.list' },
  { id:'cats', n:'Базар — категории', sub:'/market', p:'Плоская сетка 3×3: одинаковые плитки, без групп и подписей. Разделы с вложенностью открывают страницу субкатегорий того же дизайна.', f:[
    'Один размер плитки — быстрое сканирование',
    'Живой скот и Спецтехника → субкатегории',

  { id:'subcats', n:'Субкатегории', sub:'/market/livestock', p:'Тот же дизайн, что и корневые категории: плитки 3 в ряд. Пример — «Живой скот» с видами из кода.', f:[
    'Единый паттерн для любой вложенности',

  { id:'list', n:'Базар — список', sub:'/market/car', p:'Список объявлений раздела: счётчик, сортировка, фильтры. Вторая строка авто-карточки — объём · пробег · КПП.', f:[
    'Сортировка и фильтры работают в прототипе: тапните чипы',

  { id:'detail', n:'Карточка объявления', sub:'/ad/{id}', p:'Галерея со счётчиком N/M, цена крупно, характеристики по словарю раздела, продавец, четыре действия.', f:[

    'Просмотры и избранное по каждому',
    'Плюс в шапке — новая подача'], src:'market.my · ad_stats · HANDOFF §6' },
  { id:'favs', n:'Сохранённые', sub:'/saved', p:'Личные списки по типам: объявления, места карты, мастера. Сердце убирает из списка сразу.', f:[
    'Сегменты переключаются',

  { id:'food', n:'Еда — заведения', sub:'/food', p:'Анатомия Glovo: адрес в шапке, крупный заголовок, поиск, рейл категорий еды, фильтры, «Повторить заказ», большие фото-карточки заведений.', f:[

  { id:'menu', n:'Меню заведения', sub:'/food/{id}', p:'Фото-шапка с плавающими кнопками и логотипом, метрики, липкие табы, блок отзывов, список блюд, корзина снизу.', f:[

  { id:'orders', n:'Мои заказы', sub:'/food/orders', p:'Текущий заказ закреплён сверху с прогрессом, ниже — история с кнопкой «Повторить».', f:[

  { id:'checkout', n:'Оформление заказа', sub:'/food/checkout', p:'Адрес и время — редактируемые строки со шторками. В оплате клиент указывает номер Kaspi: счёт выставит заведение после принятия заказа, списания при оформлении нет.', f:[

var edgeEls=[];
function anch(id,side){
  var x=POS[id][0], y=POS[id][1];
  if(side==='r') return [x+NODE_W+8, y+LABEL_H+PHONE_H/2];
  if(side==='l') return [x-8, y+LABEL_H+PHONE_H/2];
  if(side==='t') return [x+NODE_W/2, y+LABEL_H-8];
  return [x+NODE_W/2, y+LABEL_H+PHONE_H+16];
}
EDGES.forEach(function(e){
  var from=e[0],to=e[1],label=e[2],mode=e[3],hot=e[4];
  var a,b,c1,c2;
  if(typeof mode==='number'){
    a=anch(from,'r'); b=anch(to,'l');
    var dxA=Math.max(80,(b[0]-a[0])/2.4);
    c1=[a[0]+dxA,a[1]+mode]; c2=[b[0]-dxA,b[1]+mode];
  }else if(mode==='h'){
    a=anch(from,'r'); b=anch(to,'l');
    var dx=Math.max(80,(b[0]-a[0])/2.4);
    c1=[a[0]+dx,a[1]]; c2=[b[0]-dx,b[1]];
  }else if(mode==='top'){
    a=anch(from,'t'); b=anch(to,'t');
    c1=[a[0]+80,120]; c2=[b[0]-80,120];
  }else{
    a=anch(from,'b'); b=anch(to,'t');
    c1=[a[0],a[1]+280]; c2=[b[0],b[1]-280];
  }
  var p=document.createElementNS(svgNS,'path');
  p.setAttribute('d','M'+a[0]+' '+a[1]+' C'+c1[0]+' '+c1[1]+','+c2[0]+' '+c2[1]+','+b[0]+' '+b[1]);

var tx=0, ty=0, sc=0.4;
function apply(){ world.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
  document.getElementById('z-pct').textContent=Math.round(sc*100)+'%'; }
function clampScale(v){ return Math.max(0.08, Math.min(1.6, v)); }
function zoomAt(px,py,ns){ ns=clampScale(ns); tx=px-(px-tx)*(ns/sc); ty=py-(py-ty)*(ns/sc); sc=ns; apply(); }
function animate(fn){ world.classList.add('anim'); fn(); setTimeout(function(){ world.classList.remove('anim'); },340); }
function fit(){
  var vw=viewport.clientWidth, vh=viewport.clientHeight;
  var s=clampScale(Math.min(vw/WORLD_W,vh/WORLD_H)*0.96);
  sc=s; tx=(vw-WORLD_W*s)/2; ty=(vh-WORLD_H*s)/2; apply();
}
function centerOn(id,s){
  var vw=viewport.clientWidth, vh=viewport.clientHeight;
  s=s||Math.max(sc,0.5);
  var cx=POS[id][0]+NODE_W/2, cy=POS[id][1]+(LABEL_H+PHONE_H)/2;
  animate(function(){ sc=clampScale(s); tx=vw/2-cx*sc; ty=vh/2-cy*sc; apply(); });
}
viewport.addEventListener('wheel',function(ev){
  ev.preventDefault();
  if(ev.ctrlKey||ev.metaKey){
    var r=viewport.getBoundingClientRect();
    zoomAt(ev.clientX-r.left, ev.clientY-r.top, sc*Math.pow(1.0016,-ev.deltaY*3));
  }else{ tx-=ev.deltaX; ty-=ev.deltaY; apply(); }
},{passive:false});
var pan=null;
viewport.addEventListener('pointerdown',function(ev){
  if(ev.button!==0) return;
  pan={x:ev.clientX,y:ev.clientY,tx:tx,ty:ty,moved:false,target:ev.target};
  viewport.setPointerCapture(ev.pointerId);
});
viewport.addEventListener('pointermove',function(ev){
  if(!pan) return;
  var dx=ev.clientX-pan.x, dy=ev.clientY-pan.y;
  if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true;
  if(pan.moved){ viewport.classList.add('grabbing'); tx=pan.tx+dx; ty=pan.ty+dy; apply(); }
});
viewport.addEventListener('pointerup',function(ev){
  viewport.classList.remove('grabbing');
  if(pan && !pan.moved){
    var node=pan.target.closest('.node');
    if(node) select(node.getAttribute('data-node')); else select(null);
  }
  pan=null;
});
viewport.addEventListener('dblclick',function(ev){
  var node=ev.target.closest('.node');

window.addEventListener('keydown',function(ev){
  if(presentEl.classList.contains('on')){
    if(ev.key==='Escape') closePresent();
    if(ev.key==='ArrowRight') step(1);
    if(ev.key==='ArrowLeft') step(-1);
    return;
  }
  if(ev.key==='+'||ev.key==='=') animate(function(){ zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,sc*1.25); });
  if(ev.key==='-') animate(function(){ zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,sc/1.25); });

  if(ev.key==='Escape') select(null);
});

function select(id){
  selected=id;
  document.querySelectorAll('.node').forEach(function(n){ n.classList.toggle('sel', n.getAttribute('data-node')===id); });

    e.path.classList.toggle('dim',!on); e.label.classList.toggle('dim',!on);
  });

}

function imgURL(n){ return (typeof IMGS!=='undefined'&&IMGS[n])?IMGS[n]:('img/'+n+'.jpg'); }
/* статические пути img/... в пуле → data-URI из IMGS (экономит дубли в файле) */
(function(){
  if(typeof IMGS==='undefined') return;
  document.querySelectorAll('#pool [style*="img/"],#pool [data-gal]').forEach(function(el){
    var st=el.getAttribute('style');
    if(st&&st.indexOf('img/')>=0) el.setAttribute('style', st.replace(/img\/([a-z0-9-]+)\.jpg/g, function(m,n){ return IMGS[n]||m; }));
    var dg=el.getAttribute('data-gal');
    if(dg) el.setAttribute('data-gal', dg.split(',').map(function(x){ var m=x.match(/img\/([a-z0-9-]+)\.jpg/); return (m&&IMGS[m[1]])?IMGS[m[1]]:x; }).join('|'));
  });
})();

/* ================= шторка ================= */
function money(n){ return n.toLocaleString('ru-RU').replace(/,/g,' ')+' ₸'; }
function closeSheet(){ var w=live.querySelector('.sheet-wrap'); if(w) w.remove(); }
function sheet(title,html){
  closeSheet();
  var scr=live.closest('.screen')||live;
  var w=document.createElement('div');
  w.className='sheet-wrap on';
  w.innerHTML='<div class="sheet"><div class="grab"></div>'+(title?'<h5>'+title+'</h5>':'')+html+'</div>';
  w.addEventListener('click',function(ev){ if(ev.target===w) closeSheet(); });
  scr.appendChild(w);
  return w;
}
function opt(label,sub,on,extra){ return '<div class="sh-opt'+(on?' on':'')+'" '+(extra||'')+'><div class="t">'+label+(sub?'<div class="sub">'+sub+'</div>':'')+'</div><span class="tick"></span></div>'; }

function attachVotes(){
  live.querySelectorAll('.post .ft i[data-vote]').forEach(function(b){

    function paint(){
      var v=ST.votes[key];
      var n=base+(v===dir?1:0);
      b.classList.toggle('on',v===dir);
      b.childNodes.forEach(function(nd){ if(nd.nodeType===3) nd.textContent=''; });
      b.appendChild(document.createTextNode(String(n)));
      var sp=b.querySelector('[data-role=stlikes]'); if(sp) sp.textContent=String(n);
    }
    if(b.querySelector('[data-role=stlikes]')){
      base=parseInt(b.querySelector('[data-role=stlikes]').textContent,10)||0;
      paint=function(){ var v=ST.votes[key]; b.classList.toggle('on',v===dir); b.querySelector('[data-role=stlikes]').textContent=String(base+(v===dir?1:0)); };
    }
    b.addEventListener('click',function(ev){
      ev.stopPropagation();
      ST.votes[key]=ST.votes[key]===dir?null:dir;
      paint();
      var other=b.parentNode.querySelector('[data-vote]:not([data-vote="'+dir+'"])');
      if(other) other.classList.toggle('on',ST.votes[key]===other.getAttribute('data-vote'));

function renderListScreen(){
  var app=live.querySelector('.app');
  var kind=ST.listKind||'car';
  var data=ADS[kind]||ADS.car;
  app.querySelector('.shead .tt .a').textContent=data.title;
  app.querySelectorAll('.adrow').forEach(function(r){ r.remove(); });
  var host=app;
  data.rows.forEach(function(a){ var d=document.createElement('div'); d.innerHTML=adRowHTML(a); var row=d.firstChild; row._ad=a; host.appendChild(row); });
  var rows=[].slice.call(app.querySelectorAll('.adrow'));
  var filters=LISTFILTERS[kind]||[];
  var SORTS=[['new','Сначала новые'],['cheap','Сначала дешевле'],['exp','Сначала дороже']];
  var st={mode:'new',on:{},sel:{}};

  var chips=app.querySelector('.chips');
  chips.innerHTML='<div class="chip on" data-lsort>Сначала новые ▾</div>'+
    filters.map(function(f,i){
      return f.sheet?'<div class="chip ghost" data-lf="'+i+'">'+esc(f.t)+' ▾</div>'
                    :'<div class="chip ghost" data-lf="'+i+'">'+esc(f.t)+'</div>';
    }).join('');

  function passes(a,r){
    for(var i=0;i<filters.length;i++){
      var f=filters[i];
      if(f.photo&&st.on[i]&&r.dataset.nophoto) return false;
      if(f.max&&st.on[i]&&a.p>f.max) return false;
      if(f.spec&&st.on[i]&&specOf(a,f.spec[0])!==f.spec[1]) return false;
      if(f.specStarts&&st.on[i]){ var v=specOf(a,f.specStarts[0])||''; if(v.indexOf(f.specStarts[1])!==0) return false; }
      if(f.sheet&&st.sel[i]&&st.sel[i].indexOf('Люб')!==0){
        var vv=specOf(a,f.key)||'';
        if(f.key==='Комнат'){ var rn=parseInt(vv,10); if(isNaN(rn)||rn<parseInt(st.sel[i],10)) return false; }
        else if(vv!==st.sel[i]) return false;
      }
    }
    return true;
  }
  function render(){
    var arr=rows.slice();
    if(st.mode==='cheap') arr.sort(function(a,b){return a.dataset.price-b.dataset.price;});
    if(st.mode==='exp')   arr.sort(function(a,b){return b.dataset.price-a.dataset.price;});
    if(st.mode==='new')   arr.sort(function(a,b){return b.dataset.t-a.dataset.t;});
    var shown=0;
    arr.forEach(function(r){
      var ok=passes(r._ad,r);
      r.style.display=ok?'':'none'; if(ok) shown++;
      host.appendChild(r);
    });
    var old=app.querySelector('.se-empty'); if(old) old.remove();
    if(!shown){
      var e=document.createElement('div'); e.className='se-empty';
      e.textContent='По выбранным фильтрам ничего нет — снимите один из них';
      host.appendChild(e);
    }
  }
  var sb=app.querySelector('[data-lsort]');
  sb.addEventListener('click',function(ev){ ev.stopPropagation();
    var cur=null; SORTS.forEach(function(s2){ if(s2[0]===st.mode) cur=s2[1]; });
    pickerSheet('Сортировка',SORTS.map(function(s2){ return [s2[1],'']; }),cur,function(v){
      SORTS.forEach(function(s2){ if(s2[1]===v) st.mode=s2[0]; });
      sb.textContent=v+' ▾'; render();
    });
  },true);
  app.querySelectorAll('[data-lf]').forEach(function(ch){
    var i=+ch.getAttribute('data-lf'), f=filters[i];
    ch.addEventListener('click',function(ev){ ev.stopPropagation();
      if(f.sheet){
        pickerSheet(f.t,f.sheet.map(function(o){ return [o, f.key==='Комнат'&&o!=='Любое'?o+' и больше':'']; }),st.sel[i]||f.sheet[0],function(v){
          st.sel[i]=v;
          var on=v.indexOf('Люб')!==0;
          ch.textContent=(on?(f.key==='Комнат'?'Комнат: '+v:v):f.t)+' ▾';
          ch.classList.toggle('on',on); ch.classList.toggle('ghost',!on);
          render();
        });
      }else{
        st.on[i]=!st.on[i];
        ch.classList.toggle('on',!!st.on[i]); ch.classList.toggle('ghost',!st.on[i]);
        render();
      }
    },true);
  });
  render();
  attachHearts();
}

function attachGallery(gal){
  var slides=(gal.getAttribute('data-gal')||'').split('|').filter(String);
  if(slides.length<2) return;
  var i=0, ph=gal.querySelector('.ph'), cnt=gal.querySelector('.cnt'), dots=gal.querySelectorAll('.dots i');
  gal.addEventListener('click',function(ev){
    if(ev.target.closest('.bk')) return;
    ev.stopPropagation();
    var r=gal.getBoundingClientRect();
    i=(ev.clientX-r.left < r.width/2)?(i-1+slides.length)%slides.length:(i+1)%slides.length;
    ph.style.backgroundImage='url('+slides[i]+')';
    if(cnt) cnt.textContent=(i+1)+' / '+slides.length;
    dots.forEach(function(d,j){ d.classList.toggle('on',j===i); });
  },true);
}

      s.d.map(rowHTML).join('')+
      (last&&r.off?'<div class="m-row" style="opacity:.5"><div class="t"><div class="n">'+esc(r.off.n)+'<b class="num">'+money(r.off.p)+'</b></div><div class="d">'+esc(r.off.d)+'</div></div><div class="phw">'+dishPh(r.off.img)+'</div></div>':'')+
      '</div></div>';
  }).join('');
  app.querySelectorAll('.m-cats .c').forEach(function(c){
    c.addEventListener('click',function(ev){ ev.stopPropagation();
      app.querySelectorAll('.m-cats .c').forEach(function(x){ x.classList.toggle('on',x===c); });
      var nm=c.textContent.trim();
      var target = nm==='Популярное' ? app.querySelector('.m-pop') : app.querySelector('[data-msec="'+nm+'"]');
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});

  var cb=live.querySelector('.cartbar .t'); if(cb) cb.textContent='Корзина · '+r.n;

/* ================= карта: поиск, точки, свайп-шторка ================= */
function mcCardHTML(p){
  var strip=p.gal.map(function(g,i){
    return '<div class="ph" style="background-image:url('+imgURL(g)+')">'+(i===1&&p.video?'<span class="play"></span>':'')+'</div>';
  }).join('');
  return '<div class="mc" data-place="'+p.id+'">'+
    '<div class="strip">'+strip+'</div>'+
    '<div class="in"><div class="nr"><div class="n">'+esc(p.n)+'</div>'+
    '<span class="rt"><svg class="ic"><use href="#star-filled"/></svg>'+esc(p.r)+'</span></div>'+
    '<div class="c">'+esc(p.c)+'</div>'+
    '<div class="st"><span class="dot" style="background:'+(p.open?'#1E8A4C':'#C5C1B7')+'"></span>'+
    '<span style="color:'+(p.open?'#1E8A4C':'#8B887F')+'">'+(p.h24?'Круглосуточно':(p.open?'Открыто':'Закрыто'))+'</span>'+
    '<span class="far num">'+esc(p.far)+'</span></div></div></div>';
}
function placeCardHTML(p){

  }).join('')+'</div></div>';
  /* мини: имя, тип, рейтинг, статус и кнопки — видно на четверти экрана */
  var mini='<div class="head"><div><div class="n">'+esc(p.n)+'</div><div class="s">'+esc(p.c)+'</div></div>'+
    '<div class="fav"><svg class="ic"><use href="#heart"/></svg></div></div>'+
    '<div class="rate"><svg class="ic"><use href="#star-filled"/></svg>'+esc(p.r)+' <span>'+esc(p.rev)+' отзывов</span></div>'+
    '<div class="mst"><span class="dot" style="background:'+(p.open?'#1E8A4C':'#C5C1B7')+'"></span>'+(p.open?'Открыто':'Закрыто')+'<span>· '+esc(p.hours)+'</span></div>'+
    '<div class="mbtns"><div class="b pri" data-sheet="whatsapp"><svg class="ic"><use href="#chat"/></svg>WhatsApp</div>'+
    '<div class="b sec" data-sheet="call"><svg class="ic"><use href="#phone"/></svg>Позвонить</div>'+
    '<div class="b sec" data-sheet="route"><svg class="ic"><use href="#route"/></svg>Маршрут</div></div>';
  /* полная версия целиком в шторке — отдельный экран не нужен */
  var more='<div class="pl-more">'+
    '<div class="pl-feat">'+(p.feat||['Оплата Kaspi','WhatsApp']).map(function(f){ return '<i>'+esc(f)+'</i>'; }).join('')+'</div>'+
    '<div class="pl-addr"><div class="mini"><svg><use href="#streets"/></svg></div>'+
    '<div class="t"><div class="a">'+esc(p.addr)+'</div><div class="b">'+p.far+' от вас</div></div>'+
    '<div class="go" data-sheet="route">Маршрут</div></div>'+
    '<div class="sec-lbl"><h4>Контакты</h4></div>'+
    '<div class="pl-cont"><div class="row" data-sheet="call"><svg class="ic"><use href="#phone"/></svg>'+esc(p.ph)+'</div>'+
    '<div class="row" data-sheet="whatsapp"><svg class="ic"><use href="#chat"/></svg>Написать в WhatsApp<span>'+esc(p.ph)+'</span></div></div>'+
    '<div class="sec-lbl"><h4>Отзывы</h4><span class="num">'+esc(p.rev)+'</span></div>'+
    '<div class="rv-card"><div class="who"><div class="av" style="background:#5B8DEF">'+esc(p.revName[0])+'</div>'+
    '<div><div class="nm">'+esc(p.revName)+'</div><div class="dt">'+esc(p.revWhen)+'</div></div>'+
    '<span class="stars">★★★★★</span></div><div class="tx">'+esc(p.revText)+'</div></div>'+
    '<div class="rv-card"><div class="who"><div class="av" style="background:#8A63D2">'+esc(p.rev2[0][0])+'</div>'+
    '<div><div class="nm">'+esc(p.rev2[0])+'</div><div class="dt">'+esc(p.rev2[1])+'</div></div>'+
    '<span class="stars">'+(p.rev2[3]||'★★★★☆')+'</span></div><div class="tx">'+esc(p.rev2[2])+'</div></div></div>';
  return gal+mini+more;
}
function renderMap(){
  var sheet2=live.querySelector('[data-role=msheet]');
  var full=live.querySelector('[data-role=searchfull]');
  var sfin=live.querySelector('[data-role=sfin]');
  var body={list:live.querySelector('[data-role=shlist]'),place:live.querySelector('[data-role=shplace]')};
  var shhead=live.querySelector('[data-role=shhead]');
  var shchips=live.querySelector('[data-role=shchips]');
  var shtitle=live.querySelector('[data-role=shtitle]');
  var mdock=live.querySelector('[data-role=mdock]');
  var mquery=live.querySelector('[data-role=mquery]');
  var mfil=live.querySelector('[data-role=mfilters]');
  var fabs=live.querySelector('.mfabs');
  var mapEl=live.querySelector('.mapfull');
  var shbody=live.querySelector('[data-role=shbody]');
  var pviewer=live.querySelector('[data-role=pviewer]'), pv=live.querySelector('[data-role=pv]');
  function showPhoto(url){ pv.style.backgroundImage='url("'+url+'")'; pviewer.classList.add('on'); }
  pviewer.addEventListener('click',function(ev){ ev.stopPropagation(); pviewer.classList.remove('on'); },true);

  var lstItems=[], lstF={}, lstR=0, lstS='def', shMode='list', snap='', listActive=false;

  function setSnap(cls){
    snap=cls;
    sheet2.className='msheet2'+(cls?' '+cls:'');
    if(cls!=='full') shbody.scrollTop=0;
    fabs.style.display = (cls==='cards'||cls==='full') ? 'none' : '';
    fabs.style.bottom = cls==='peek' ? '282px' : '';
    mdock.style.display = cls ? 'none' : '';
  }
  function setQuery(t){
    if(t){ mquery.style.display='flex'; live.querySelector('[data-role=mapph]').textContent=t; }
    else mquery.style.display='none';
  }
  function closeSheet2(){
    setSnap('');
    listActive=false;
    shhead.style.display='none'; shchips.style.display='none';
    setQuery('');
    live.querySelectorAll('.mchips .chip').forEach(function(x){ x.classList.remove('on'); });
    live.querySelectorAll('[data-pin]').forEach(function(x){ x.classList.remove('on'); });
    live.querySelectorAll('[data-pin=ad]').forEach(function(x){ x.remove(); });
  }

  /* быстрые чипы и экран «Фильтры» работают с одним состоянием: lstF + lstR + lstS */
  function syncChips(){
    shchips.querySelectorAll('[data-mf]').forEach(function(c){
      var k=c.getAttribute('data-mf');
      var on = k==='near' ? lstS==='near' : !!lstF[k];
      c.classList.toggle('on',on); c.classList.toggle('ghost',!on);
    });
    var n=(lstF.open?1:0)+(lstF.del?1:0)+(lstF.h24?1:0)+(lstR?1:0)+(lstS!=='def'?1:0);
    live.querySelector('[data-role=fbtnt]').textContent = n ? 'Фильтры · '+n : 'Фильтры';
    live.querySelector('[data-role=fbtn]').classList.toggle('on', n>0);
  }
  function syncFilPage(){
    mfil.querySelectorAll('[data-mfk]').forEach(function(r){ r.classList.toggle('on', !!lstF[r.getAttribute('data-mfk')]); });
    mfil.querySelectorAll('[data-mfr]').forEach(function(r){ r.classList.toggle('on', lstR===parseFloat(r.getAttribute('data-mfr'))); });
    mfil.querySelectorAll('[data-mfs]').forEach(function(r){ r.classList.toggle('on', lstS===r.getAttribute('data-mfs')); });
  }
  shchips.querySelectorAll('[data-mf]').forEach(function(c){
    c.addEventListener('click',function(ev){ ev.stopPropagation();
      var k=c.getAttribute('data-mf');
      if(k==='near') lstS = lstS==='near' ? 'def' : 'near';
      else lstF[k]=!lstF[k];
      syncChips(); renderList();
    },true);
  });
  live.querySelector('[data-role=fbtn]').addEventListener('click',function(ev){ ev.stopPropagation(); syncFilPage(); mfil.classList.add('on'); },true);
  mfil.querySelectorAll('[data-mfk]').forEach(function(r){
    r.addEventListener('click',function(ev){ ev.stopPropagation();
      var k=r.getAttribute('data-mfk'); lstF[k]=!lstF[k]; syncFilPage(); },true);
  });
  mfil.querySelectorAll('[data-mfr]').forEach(function(r){
    r.addEventListener('click',function(ev){ ev.stopPropagation();
      var v=parseFloat(r.getAttribute('data-mfr'));
      lstR = lstR===v ? 0 : v; syncFilPage(); },true);
  });
  mfil.querySelectorAll('[data-mfs]').forEach(function(r){
    r.addEventListener('click',function(ev){ ev.stopPropagation(); lstS=r.getAttribute('data-mfs'); syncFilPage(); },true);
  });
  live.querySelector('[data-role=mfreset]').addEventListener('click',function(ev){ ev.stopPropagation(); lstF={}; lstR=0; lstS='def'; syncFilPage(); },true);
  live.querySelector('[data-role=mfdone]').addEventListener('click',function(ev){ ev.stopPropagation(); mfil.classList.remove('on'); syncChips(); renderList(); },true);
  live.querySelector('[data-role=shx]').addEventListener('click',function(ev){ ev.stopPropagation(); closeSheet2(); },true);

  function rnum(p){ return parseFloat(String(p.r).replace(',','.'))||0; }
  function renderList(){
    var items=lstItems.filter(function(p){
      if(lstF.open&&!p.open) return false;
      if(lstF.del&&!p.del) return false;
      if(lstF.h24&&!p.h24) return false;
      if(lstR&&rnum(p)<lstR) return false;
      return true;
    });
    if(lstS==='near') items=items.slice().sort(function(a,b){ return (a.farM||9e9)-(b.farM||9e9); });
    if(lstS==='rate') items=items.slice().sort(function(a,b){ return rnum(b)-rnum(a); });
    var anyF=lstF.open||lstF.del||lstF.h24||!!lstR;
    body.list.innerHTML = items.length ? items.map(function(p){ return p._mc||(p._mc=mcCardHTML(p)); }).join('')
      : '<div class="se-empty">'+(anyF?'По фильтрам ничего нет — снимите один из них':'Ничего не нашли — попробуйте изменить запрос')+'</div>';
    body.list.querySelectorAll('[data-place]').forEach(function(c){
      var strip=c.querySelector('.strip'), sl=0;
      if(strip) strip.addEventListener('pointerdown',function(){ sl=strip.scrollLeft; },true);
      c.addEventListener('click',function(ev){
        if(strip&&ev.target.closest('.strip')&&Math.abs(strip.scrollLeft-sl)>8) return;
        ev.stopPropagation(); openPlace(c.getAttribute('data-place'));
      },true);
    });
  }
  function showList(items,title){
    shMode='list'; listActive=true;
    lstItems=items; lstF={}; lstR=0; lstS='def';
    shtitle.textContent=title;
    shhead.style.display='flex'; shchips.style.display='block';
    syncChips();
    body.place.style.display='none'; body.list.style.display='';
    renderList();
    setSnap('cards');
  }
  function openPlace(id){
    var p=PLACES.filter(function(x){return x.id===id;})[0]; if(!p) return;
    ST.curPlace=id; shMode='place';
    ST.ctxPh=p.ph||null;
    shhead.style.display='none'; shchips.style.display='none';
    body.list.style.display='none'; body.place.style.display='';
    body.place.setAttribute('data-ph',p.ph||'');
    body.place.innerHTML=(p._pc||(p._pc=placeCardHTML(p)));
    live.querySelectorAll('[data-pin]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-pin')===id); });
    setSnap('peek');
    var f=body.place.querySelector('.fav');
    var syncFav=function(){
      var on=!!ST.fav[p.n];
      f.classList.toggle('on',on);
      f.querySelector('use').setAttribute('href',on?'#heart-filled':'#heart');
    };
    syncFav();
    f.addEventListener('click',function(ev){ ev.stopPropagation();
      if(ST.fav[p.n]) delete ST.fav[p.n]; else ST.fav[p.n]=1;
      syncFav();
    },true);
    /* фото полной карточки открываются лайтбоксом */
    var strip=body.place.querySelector('.pl-topgal .strip');
    if(strip){
      var sl=0;
      strip.addEventListener('pointerdown',function(){ sl=strip.scrollLeft; },true);
      strip.querySelectorAll('.ph').forEach(function(ph,i){
        ph.addEventListener('click',function(ev){ ev.stopPropagation();
          if(Math.abs(strip.scrollLeft-sl)>8) return;
          showPhoto(imgURL(p.gal[i]));
        },true);
      });
    }
  }
  function backToList(){
    shMode='list';
    body.place.style.display='none'; body.list.style.display='';
    shhead.style.display='flex'; shchips.style.display='block';
    live.querySelectorAll('[data-pin]').forEach(function(x){ x.classList.remove('on'); });
    setSnap('cards');
  }

  /* точки на карте */
  live.querySelectorAll('.mpin').forEach(function(x){ x.remove(); });
  PLACES.forEach(function(p){
    var pin=document.createElement('div');
    pin.className='mpin'; pin.setAttribute('data-pin',p.id);
    pin.style.left=p.x+'px'; pin.style.top=p.y+'px';
    pin.innerHTML='<svg class="ic"><use href="#location"/></svg>';
    mapEl.parentNode.insertBefore(pin, mapEl.nextSibling);
    pin.addEventListener('click',function(ev){ ev.stopPropagation(); openPlace(p.id); },true);
  });

  /* полноэкранный поиск: из дока пустым, из пилюли — с текущим запросом */
  function openSearch(pre){
    full.classList.add('on');
    sfin.value=pre||'';
    setTimeout(function(){ try{ sfin.focus(); }catch(e){} },60);
  }
  function closeSearch(){ full.classList.remove('on'); sfin.value=''; }
  live.querySelector('[data-role=mapsearch]').addEventListener('click',function(ev){ ev.stopPropagation(); openSearch(''); },true);
  mquery.addEventListener('click',function(ev){ ev.stopPropagation(); openSearch(live.querySelector('[data-role=mapph]').textContent); },true);
  live.querySelector('[data-role=sfclose]').addEventListener('click',function(ev){ ev.stopPropagation(); closeSearch(); },true);
  sfin.addEventListener('click',function(ev){ ev.stopPropagation(); },true);
  function runSearch(q,label){
    q=(q||'').trim(); if(!q) return;
    var ql=q.toLowerCase();
    var hits=PLACES.filter(function(p){ return (p.n+' '+p.c+' '+MCATS[p.cat]).toLowerCase().indexOf(ql)>=0; });
    closeSearch();
    var t=label||'';
    if(!t){ for(var k in MCATS) if(MCATS[k].toLowerCase()===ql) t=MCATS[k]; }
    if(!t) t=q.charAt(0).toUpperCase()+q.slice(1);
    setQuery(t);
    showList(hits,t);
  }
  sfin.addEventListener('keydown',function(ev){ if(ev.key==='Enter') runSearch(sfin.value); });
  live.querySelectorAll('.sf-h').forEach(function(h){
    h.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(ev.target.closest('.ic.x')){ h.remove(); return; }
      runSearch(h.getAttribute('data-seq'), h.querySelector('span').textContent);
    },true);
  });
  live.querySelectorAll('[data-mcat]').forEach(function(c){
    c.addEventListener('click',function(ev){ ev.stopPropagation();
      var k=c.getAttribute('data-mcat');
      closeSearch();
      live.querySelectorAll('.mchips .chip').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-mcat')===k); });
      var items = k==='all' ? PLACES : PLACES.filter(function(p){ return p.cat===k; });
      var t = k==='all' ? 'Все места' : MCATS[k];
      setQuery(t);
      showList(items,t);
    },true);
  });

  live.querySelector('[data-role=locate]').addEventListener('click',function(ev){
    ev.stopPropagation();
    actionSheet('Моё местоположение',[{ic:'locate-me',t:'Шу қаласы, ул. Желтоқсан 12',sub:'определено по GPS',done:'Центрируем карту…'}]);
  },true);

  /* свайп шторки */
  var grab=live.querySelector('[data-role=grab]');
  var drag=null;
  function ord(){ return shMode==='ad'?['','peek']:shMode==='place'?['','peek','full']:['','peek','cards','full']; }
  function curIdx(){ return Math.max(0, ord().indexOf(snap)); }
  grab.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); drag={y:ev.clientY,idx:curIdx(),moved:false}; grab.setPointerCapture(ev.pointerId); });
  grab.addEventListener('pointermove',function(ev){ if(drag&&Math.abs(drag.y-ev.clientY)>6) drag.moved=true; });
  grab.addEventListener('pointerup',function(ev){
    if(!drag) return;
    var dy=drag.y-ev.clientY, i=drag.idx, o=ord();
    if(drag.moved) i = dy>0 ? Math.min(o.length-1,i+1) : Math.max(0,i-1);
    else i = i>=o.length-1 ? 1 : i+1;
    if(i===0){ if(shMode==='place'&&listActive) backToList(); else closeSheet2(); }
    else setSnap(o[i]);
    drag=null;
  });
  grab.addEventListener('click',function(ev){ ev.stopPropagation(); },true);

  /* ручка дока: тап или свайп вверх — список всех мест */
  var dgrab=live.querySelector('.mdock .mgrab');
  if(dgrab){
    var dY=null;
    dgrab.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); dY=ev.clientY; },true);
    dgrab.addEventListener('pointerup',function(ev){
      ev.stopPropagation();
      if(dY===null) return;
      if(dY-ev.clientY>-6){
        live.querySelectorAll('.mchips .chip').forEach(function(x){ x.classList.remove('on'); });
        setQuery('Все места'); showList(PLACES,'Все места');
      }
      dY=null;
    });
    dgrab.addEventListener('click',function(ev){ ev.stopPropagation(); },true);
  }

  /* режимы входа: метка объявления / категория с главной */
  if(ST.mapMode==='ad'){
    var ad=ST.curAd||ADS.car.rows[0];
    var apin=document.createElement('div');
    apin.className='mpin'; apin.setAttribute('data-pin','ad');
    apin.style.left='150px'; apin.style.top='452px';
    apin.innerHTML='<svg class="ic"><use href="#location"/></svg>';
    mapEl.parentNode.insertBefore(apin, mapEl.nextSibling);
    var openAd=function(){
      shMode='ad'; listActive=false;
      shhead.style.display='none'; shchips.style.display='none';
      body.list.style.display='none'; body.place.style.display='';
      body.place.removeAttribute('data-ph');
      body.place.innerHTML='<div class="head"><div><div class="n">'+esc(ad.n)+'</div><div class="s">'+esc(ad.m)+'</div></div></div>'+
        '<div class="rate"><svg class="ic"><use href="#location"/></svg><span>Место продажи, указанное продавцом</span></div>'+
        '<div class="mbtns" style="margin-top:12px"><div class="b pri" data-sheet="route"><svg class="ic"><use href="#route"/></svg>Маршрут</div>'+
        '<div class="b sec" data-back="detail">К объявлению</div></div>';
      live.querySelectorAll('[data-pin]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-pin')==='ad'); });
      setQuery(ad.n);
      setSnap('peek');
    };
    apin.addEventListener('click',function(ev){ ev.stopPropagation(); openAd(); },true);
    openAd(); ST.mapMode=null; return;
  }
  if(ST.mapCat){
    var k=ST.mapCat; ST.mapCat=null;
    var t=MCATS[k]||'Места';
    live.querySelectorAll('.mchips .chip').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-mcat')===k); });
    setQuery(t);
    showList(PLACES.filter(function(p){ return p.cat===k; }), t);
    return;
  }
  closeSheet2();
}

function renderEmployer(){

function renderSearch(){
  var inp=live.querySelector('[data-role=sein]');
  var res=live.querySelector('[data-role=seres]');
  var def=live.querySelector('[data-role=sedef]');
  var scope=ST.searchScope, sc=scope?SCOPES[scope]:null;
  live.querySelector('.shead .tt .a').textContent=sc?sc.t:'Поиск';
  inp.placeholder=sc?sc.ph:'iPhone, электрик, самса…';
  if(sc){
    def.querySelector('.sec-lbl h4').textContent='Часто ищут';
    def.querySelector('.chips').innerHTML=sc.chips.map(function(c){ return '<div class="chip" data-seq="'+esc(c.toLowerCase())+'">'+esc(c)+'</div>'; }).join('');
  }
  function row(it,idx){
    var ph=it.img?'<div class="ph" style="width:56px;height:50px;border-radius:10px;flex:none;background-image:url('+imgURL(it.img)+')"></div>'
                 :'<div class="ph" style="width:56px;height:50px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8B887F">'+esc(it.t[0])+'</div>';
    return '<div class="adrow" style="align-items:center" data-seidx="'+idx+'">'+ph+'<div class="t"><div class="n" style="margin-top:0">'+esc(it.t)+'</div><div class="s">'+esc(it.s)+'</div></div><svg class="ic" style="width:14px;height:14px;color:#C5C1B7"><use href="#chevron-right"/></svg></div>';
  }
  var lastItems=[];
  function doSearch(q){
    q=(q||'').trim().toLowerCase();
    if(q.length<2){ res.innerHTML=''; def.style.display=''; return; }
    def.style.display='none';
    var hits=SEARCH_DB.filter(function(it){ return (!scope||it.sec===scope)&&it.k.indexOf(q)>=0; }).slice(0,14);
    lastItems=hits;
    if(!hits.length){ res.innerHTML='<div class="se-empty">Ничего не нашли по запросу «'+esc(q)+'»'+(scope?' в разделе «'+scope+'»':'')+'.<br>Попробуйте короче — например, из подсказок выше</div>'; return; }
    var bySec={}, order=[];
    hits.forEach(function(h){ if(!bySec[h.sec]){ bySec[h.sec]=[]; order.push(h.sec);} bySec[h.sec].push(h); });
    res.innerHTML=order.map(function(sec){
      return '<div class="sv-grp" style="padding-top:6px">'+sec+'</div>'+bySec[sec].map(function(h){ return row(h,hits.indexOf(h)); }).join('');
    }).join('');
    res.querySelectorAll('[data-seidx]').forEach(function(r){
      r.addEventListener('click',function(ev){
        ev.stopPropagation();
        var it=lastItems[+r.getAttribute('data-seidx')];
        if(typeof it.go==='function') it.go(); else show(it.go);
      },true);
    });
  }
  inp.addEventListener('input',function(){ doSearch(inp.value); });
  inp.addEventListener('click',function(ev){ ev.stopPropagation(); },true);
  live.querySelectorAll('[data-seq]').forEach(function(ch){
    ch.addEventListener('click',function(ev){ ev.stopPropagation(); inp.value=ch.getAttribute('data-seq'); doSearch(inp.value); },true);
  });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },50);
}

function attachInfinite(){
  var app=live.querySelector('.app'); if(!app) return;
  var feed=app.querySelector('.h-feed'), loader=app.querySelector('.h-loader');
  if(!feed||!loader) return;
  var EXTRA=[
    ['180 000 ₸','Смартфон Redmi 12, новый','Төле би','phone'],
    ['1 200 000 ₸','Кобыла, 4 года, со справкой','Алға','horse1'],
    ['45 000 ₸','Стиральная машина LG, 6 кг','Шу қаласы','washer'],
    ['3 100 000 ₸','Hyundai Accent, газ-бензин','Төле би','car-accent'],
    ['95 000 ₸','Бараны курдючные, 8 голов','Жаңажол','sheep2'],
    ['90 000 ₸','Диван раскладной, чистый','Бірлік','sofa'],
    ['5 600 000 ₸','ГАЗель Next, рефрижератор','Шу қаласы','car-gazelle'],
    ['22 000 000 ₸','Экскаватор JCB, 2014','Шу қаласы','excavator'],
    ['14 500 000 ₸','Трактор с пресс-подборщиком','Алға','tractor'],
    ['480 000 ₸','Коровы чёрно-пёстрые, 4 головы','Жаңажол','cow1'],
    ['120 000 ₸','Дом 3 комнаты, помесячно','Шу қаласы','house2'],
    ['75 000 ₸','Ковёр шерстяной 3×4','Шу қаласы','camel']
  ];
  var total=6, MAX=29, idx=0, busy=false, batch=0;
  app.onscroll=function(){
    if(busy) return;
    if(app.scrollTop+app.clientHeight < app.scrollHeight-260) return;
    if(total>=MAX){ loader.textContent='Это все 29 объявлений в Шу'; return; }
    busy=true; loader.textContent='Загружаем ещё…';
    setTimeout(function(){
      for(var k=0;k<4&&total<MAX;k++){
        var d=EXTRA[idx++%EXTRA.length];
        var el=document.createElement('div');
        el.className='gcard'; el.setAttribute('data-go','detail');
        el.innerHTML='<div class="ph" style="background-image:url('+imgURL(d[3])+')"></div><div class="in"><div class="p num">'+d[0]+'</div><div class="t">'+d[1]+'</div><div class="m">'+d[2]+' · вчера</div></div>';
        feed.appendChild(el); total++;
      }
      if(batch%2===1){
        var ad=document.createElement('div');
        ad.className='gcard adv'; ad.setAttribute('data-sheet','adv');
        ad.innerHTML='<div class="bx">'+(batch%4===1?'🚜':'📱')+'</div><div class="t"><div class="k">РЕКЛАМА</div><div class="n">'+(batch%4===1?'Запчасти для спецтехники — склад в Шу':'Kaspi Red в магазине «Береке» — рассрочка 0-0-12')+'</div><div class="d">Разместить рекламу: из кабинета</div></div>';
        feed.appendChild(ad);
      }
      batch++;
      loader.textContent = total>=MAX ? 'Это все 29 объявлений в Шу' : 'Листайте — подгрузим ещё';
      busy=false;
    },450);
  };
}

/* ================= степперы в меню заведения ================= */
function attachSteppers(){
  var bar=live.querySelector('.cartbar'); if(!bar) return;
  var cart=cartOf();
  var items=[];
  live.querySelectorAll('.m-dish,.m-row').forEach(function(card){
    var pt = card.querySelector('.in .p') || card.querySelector('.n b');
    var nt = card.querySelector('.in .n') || card.querySelector('.n');
    if(!pt||!nt) return;
    var price=parseInt(pt.textContent.replace(/[^0-9]/g,''),10)||0;
    var name=nt.childNodes[0].textContent.trim();
    var holder = card.querySelector('.plus') || card.querySelector('.qty');
    if(!holder) return;
    var qty = cart[name]?cart[name].q:0;
    items.push({card:card,price:price,qty:qty,holder:holder,name:name});
  });
  function total(){
    var m={}; items.forEach(function(i){ m[i.name]={q:i.qty,p:i.price}; });
    var n=0,s=0; Object.keys(m).forEach(function(k){ n+=m[k].q; s+=m[k].q*m[k].p; });
    return {n:n,s:s};
  }
  function persist(){
    items.forEach(function(i){ if(i.qty>0) cart[i.name]={p:i.price,q:i.qty}; else delete cart[i.name]; });
  }
  function syncDupes(it){
    items.forEach(function(o){ if(o!==it&&o.name===it.name&&o.qty!==it.qty){ o.qty=it.qty; swap(o,o.holder); } });
  }
  function refreshBar(){
    var t=total();
    if(t.n===0){ bar.style.display='none'; return; }
    bar.style.display='flex';
    bar.querySelector('.q').textContent=t.n;
    bar.querySelector('.p').textContent=money(t.s);
  }
  function render(it){
    var el;
    if(it.qty===0){
      el=document.createElement('div'); el.className='plus';
      el.innerHTML='<svg class="ic"><use href="#plus"/></svg>';
      el.onclick=function(ev){ ev.stopPropagation(); it.qty=1; swap(it,el); };
    }else{
      el=document.createElement('div'); el.className='qty';
      el.innerHTML='<b data-m="-">−</b><span>'+it.qty+'</span><b data-m="+">+</b>';
      el.onclick=function(ev){
        ev.stopPropagation();
        var m=ev.target.getAttribute('data-m'); if(!m) return;
        it.qty += (m==='+'?1:-1);
        if(it.qty<0) it.qty=0;
        swap(it,el);
      };
    }
    return el;
  }
  function swap(it,oldEl){
    var neu=render(it);
    oldEl.parentNode.replaceChild(neu,oldEl);
    it.holder=neu; persist(); refreshBar(); syncDupes(it);
  }
  items.forEach(function(it){ swap(it,it.holder); });
  refreshBar();
}

function pickerSheet(title,items,cur,cb){
  var w=sheet(title,items.map(function(it){ return opt(it[0],it[1]||'',it[0]===cur,'data-pick="'+esc(it[0])+'"'); }).join(''));
  w.querySelectorAll('[data-pick]').forEach(function(o){
    o.addEventListener('click',function(ev){ ev.stopPropagation();
      w.querySelectorAll('[data-pick]').forEach(function(x){ x.classList.toggle('on',x===o); });
      setTimeout(function(){ closeSheet(); if(cb) cb(o.getAttribute('data-pick')); },240);
    },true);
  });
  return w;
}
function actionSheet(title,rows){
  var w=sheet(title,rows.map(function(r,i){
    return '<div class="sh-opt" data-act="'+i+'">'+(r.ic?'<svg class="ic"><use href="#'+r.ic+'"/></svg>':'')+'<div class="t">'+r.t+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+'</div><svg class="ic" style="width:14px;height:14px;color:#C5C1B7"><use href="#chevron-right"/></svg></div>';
  }).join(''));
  w.querySelectorAll('[data-act]').forEach(function(o){
    o.addEventListener('click',function(ev){ ev.stopPropagation();
      var r=rows[+o.getAttribute('data-act')];
      if(r.done){ o.innerHTML='<svg class="ic" style="color:#1E8A4C"><use href="#check-circle"/></svg><div class="t">'+r.done+'</div>'; setTimeout(closeSheet,650); }
      else { closeSheet(); if(r.go) show(r.go); if(r.fn) r.fn(); }
    },true);
  });
  return w;
}

/* ---------- клики ---------- */
document.addEventListener('click',function(ev){
  var _ld=document.querySelector('.h-langdd.on');
  if(_ld && !ev.target.closest('.h-lang')) _ld.classList.remove('on');
  var exp=ev.target.closest('[data-exp]');
  if(exp){ ev.stopPropagation(); openPresent(exp.getAttribute('data-exp')); return; }
  if(!presentEl.classList.contains('on')) return;
  /* интерактив внутри кликабельных карточек (сердце, голоса, теги) обрабатывают свои листенеры */
  if(ev.target.closest('.fav,.hrt,[data-vote],.htag')) return;
  var bk=ev.target.closest('[data-back]');
  if(bk){ ev.preventDefault(); ev.stopPropagation(); closeSheet(); goBack(bk.getAttribute('data-back')); return; }
  var inSheet=ev.target.closest('.sheet');
  var g=ev.target.closest('[data-go]');
  /* вложенное действие (поделиться внутри карточки) важнее перехода по всей карточке */
  var nested=ev.target.closest('[data-sheet]');
  if(g&&nested&&g.contains(nested)&&nested!==g){ g=null; }
  if(g){
    ev.preventDefault(); ev.stopPropagation();
    if(g.hasAttribute('data-kind')){ ST.listKind=g.getAttribute('data-kind'); }
    if(g.hasAttribute('data-rest')){ ST.curRest=g.getAttribute('data-rest'); }
    if(g.hasAttribute('data-vac')){ ST.curVac=g.getAttribute('data-vac'); }
    if(g.hasAttribute('data-story')){ ST.curStory=g.getAttribute('data-story'); }
    if(g.getAttribute('data-go')==='post'){
      if(g.hasAttribute('data-post')){ ST.curPost=g.getAttribute('data-post'); ST.curPostEl=g.cloneNode(true); }
      else { ST.curPost=null; ST.curPostEl=null; }
    }
    if(g.hasAttribute('data-emp')){ ST.curEmp=g.getAttribute('data-emp'); }
    if(g.getAttribute('data-go')==='search'&&cur!=='search'){ ST.searchScope=SCOPEOF[cur]||null; }
    ST.mapMode=g.getAttribute('data-mapmode')||null;
    if(g.hasAttribute('data-mcatgo')) ST.mapCat=g.getAttribute('data-mcatgo');
    if(g.getAttribute('data-go')==='detail'){
      if(g._ad){ ST.curAd=g._ad; }
      else{ var tt=g.querySelector('.t .n,.in .t,.t'); var ad=findAdByName(tt?tt.textContent:''); if(ad) ST.curAd=ad; }
    }
    if(inSheet) closeSheet();
    show(g.getAttribute('data-go'));
    return;
  }
  var sm=ev.target.closest('[data-stm]');
  if(sm){
    ev.stopPropagation();
    var key=sm.getAttribute('data-stm'); var s=STORIES[key]; ST.curStory=key;
    live.querySelectorAll('[data-stm]').forEach(function(x){
      x.classList.toggle('on',x===sm);
      var lk=x.querySelector('.lk'); if(lk&&x!==sm) lk.remove();
    });
    if(!sm.querySelector('.lk')){ var lk2=document.createElement('span'); lk2.className='lk'; lk2.style.color='#fff'; lk2.textContent='❤ '+s.likes; sm.appendChild(lk2); }
    var card=live.querySelector('.stcard');
    if(card){
      card.setAttribute('data-story',key);
      card.querySelector('.ph').style.backgroundImage='url('+imgURL(s.img)+')';
      card.querySelector('.a').textContent=s.t;
      card.querySelector('.b').textContent=s.m.split('·').slice(0,2).join('·');
      card.querySelector('.m').innerHTML='<span>❤ '+s.likes+'</span><span>💬 3</span>'+(key==='plant'?'<span>Фото дня</span>':'');
    }
    return;
  }
  var sh=ev.target.closest('[data-sheet]');
  if(sh){ ev.preventDefault(); ev.stopPropagation();
    var fn=SHEETS[sh.getAttribute('data-sheet')];
    if(fn) fn(sh);
  }
},true);
document.addEventListener('click',function(ev){
  if(!ev.target.closest('#mdesc') && !ev.target.closest('#btn-mdesc'))
    document.getElementById('mdesc').classList.remove('on');
});

/* ---------- старт ---------- */
var hash=(location.hash.match(/s=([a-z]+)/)||[])[1];
if(isMobile){ openPresent(hash&&BYID[hash]?hash:'home'); }
else{
  fit(); renderInspector(null);
  if(hash&&BYID[hash]) openPresent(hash);
}
})();
